# ─────────────────────────────────────────────────────────────────────────────
# Obligatory complexes — must find ALL members for the function to be present.
# ─────────────────────────────────────────────────────────────────────────────
complexes:
  aps_reductase:
    members: [aprA, aprB]
    obligatory: true
    application: "APS <=> sulfite; dissimilatory (with dsr) or reverse (sulfur oxidizers)"
  dsr_reductase:
    members: [dsrA, dsrB]
    obligatory: true
    application: "Dissimilatory sulfite reduction (SO3²⁻ => H2S); ⚠️ reductive vs reverse direction set by synteny/synergy"
  sox_core:
    members: [soxA, soxB, soxX, soxY, soxZ]
    obligatory: true
    application: "Thiosulfate oxidation (S2O3²⁻ => SO4²⁻) with no S⁰ intermediate; the canonical Sox pathway"
  sox_dehydrogenase:
    members: [soxC, soxD]
    obligatory: true
    application: "SoxCD sulfane dehydrogenase; its absence (soxB+ soxCD-) marks the S⁰-storing branched Sox of green/purple sulfur bacteria"
  qmo_complex:
    members: [qmoA, qmoB, qmoC]
    obligatory: true
    application: "Couples APS reductase to menaquinone in dissimilatory sulfate reducers"
  soe_sulfite_dh:
    members: [soeA, soeB, soeC]
    obligatory: true
    application: "Membrane sulfite => sulfate oxidation (quinone-linked)"
  assim_atp_sulfurylase:
    members: [cysN, cysD]
    obligatory: true
    application: "Assimilatory SO4²⁻ => APS (cysNC bifunctional fusion is an alternative)"
  assim_sulfite_reductase:
    members: [cysJ, cysI]
    obligatory: true
    application: "Assimilatory NADPH sulfite => sulfide (sir/Fd-type is an alternative)"
  tetrathionate_reductase:
    members: [ttrA, ttrB, ttrC]
    obligatory: true
    application: "Tetrathionate => thiosulfate respiration"
  thiosulfate_reductase:
    members: [phsA, phsB, phsC]
    obligatory: true
    application: "Thiosulfate => sulfite + sulfide respiration"
  taurine_transporter:
    members: [tauA, tauB, tauC]
    obligatory: true
    application: "Taurine uptake feeding tauD desulfonation"

# ─────────────────────────────────────────────────────────────────────────────
# Process-completeness modules — scored as completeness fractions, interpreted in
# the gap-analysis report. Alternative/redundant members noted per module.
# ─────────────────────────────────────────────────────────────────────────────
synergies:
  - name: complete_sulfate_reduction
    requires: [sat, aprA, aprB, dsrA, dsrB]
    benefit: "Full dissimilatory sulfate reduction (SO4²⁻ => H2S). qmoABC + dsrMK + dsrD confirm a canonical sulfate reducer (reductive direction)."
  - name: reverse_dsr_sulfur_oxidation
    requires: [dsrA, dsrB, aprA, sat]
    benefit: "Reverse-Dsr sulfur oxidation (H2S/S⁰ => SO4²⁻) in sulfur oxidizers. Distinguished from sulfate reduction by ABSENCE of dsrD + presence of sox/sqr (see resolve_dsr_direction)."
  - name: complete_sox_oxidation
    requires: [soxA, soxB, soxX, soxY, soxZ]
    benefit: "Complete thiosulfate oxidation to sulfate (no S⁰ intermediate); add soxCD for the full Kelly-Friedrich Sox cycle."
  - name: sulfide_oxidation
    requires: [sqr]
    benefit: "Sulfide => S⁰/polysulfide entry to oxidation. fccAB is an alternative to sqr; sdo handles the S⁰ => sulfite step downstream."
  - name: assimilatory_complete
    requires: [cysN, cysH, cysI, cysK]
    benefit: "End-to-end biosynthetic sulfur (SO4²⁻ => sulfide => cysteine). cysNC counts for cysN; sir for cysI; cysM for cysK."
  - name: thiosulfate_disproportionation
    requires: [phsA, soxB]
    benefit: "Thiosulfate disproportionation/respiration: phs/ttr reductive arm co-occurring with sox/sdo oxidative arm."
  - name: dmsp_demethylation
    requires: [dmdA]
    benefit: "DMSP demethylation branch (carbon/sulfur retained as MeSH); dominant marine DMSP fate, suppresses DMS climate flux."
  - name: dmsp_cleavage
    requires: [dddP]
    benefit: "DMSP cleavage branch => DMS (climate-active gas). Balance of dddP vs dmdA sets the marine DMS yield."
  - name: organosulfonate_scavenging
    requires: [tauD, ssuD]
    benefit: "Sulfur scavenging from taurine + alkanesulfonates under sulfate starvation (releases sulfite back into the cycle)."
