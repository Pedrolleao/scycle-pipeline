  # ── 2. Sulfur oxidation (H2S / S⁰ / S2O3²⁻ → SO4²⁻) ────────────────────────
  - id: soxA
    name: SoxA L-cysteine S-thiosulfotransferase (Sox core)
    category: sulfur_oxidation
    ko: [K17222]
    pfam: []
    interpro: [IPR025519]
    # SP2 (2026-05-25): dropped requires_blast_for_confirmation. K17222 is SoxA-specific and
    # S6 handles the blast-only E. coli FP that motivated the gate, which was instead causing
    # the Sulfurimonas (epsilonproteobacterial) SoxA FN. Seeds stay as corroboration.
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: [O33434, Q1W3E4, Q8KDM7, D7A6E5, Q08IS0]   # S2-curated, EC 2.8.5.2-verified clade-spread SoxA: Paracoccus pantotrophus + Allochromatium vinosum + Chlorobaculum tepidum + Starkeya novella + Hydrogenophilus thermoluteolus
    ref_query: "Paracoccus pantotrophus[organism] AND soxA[gene]"
    notes: "⚠️ Periplasmic thiosulfate-oxidizing Sox system. The gene name 'soxA' is shared with sarcosine oxidase, dibenzothiophene monooxygenase (dszA), and the human SOX21 TF — the name-fetched UniProt set pulled those → an E. coli cyt-c FP. Curated to EC 2.8.5.2 SoxA only + BLAST gate; the Paracoccus seed covers the panel's P. denitrificans positive. soxA + soxXYZ + soxB (+soxCD) = complete thiosulfate oxidation with no S⁰ intermediate."
