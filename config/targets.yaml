    ref_query: "Paracoccus pantotrophus[organism] AND soxC"
    notes: "⚠️ PF03473 (MOSC molybdopterin) is broad; KO K17225 is SoxC-specific. BLAST seeds corroborate and drop Mo-cofactor paralog FPs."
  - id: soxD
