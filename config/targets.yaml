# ─────────────────────────────────────────────────────────────────────────────
# targets.yaml — single source of truth for the sulfur-cycle detection pipeline.
#
# Modeled on Nitrogen_Cycle/ncycle-pipeline/config/targets.yaml (which itself
# descends from Holomicrobiome-ewaste/ewaste-pipeline). Three blocks:
#   targets:    individual enzymes/genes. Each carries KO (primary anchor),
#               Pfam/InterPro and TIGRFAM/NCBIfam HMM anchors, an optional
#               custom-HMM tier, and a BLAST fallback/confirmation gate.
#   complexes:  obligatory multi-subunit assemblies. Scored n/N per MAG by the
#               complex-completeness step.
#   synergies:  process-completeness modules (complete sulfate reduction, Sox
#               oxidation, assimilation, DMSP cycling, ...) flagged in gap-analysis.
#
# Detection is KO-primary: build_hmm_db.py extracts the KOfam profile + adaptive
# threshold for every `ko:` here. All KO numbers below were verified against the
# cached KOfam `ko_list` (release 2026-05-24) — e.g. K11179 is NOT dsrC (it is a
# tRNA-thiouridine protein), so dsrC/dsrD are anchored on Pfam instead. See
# Info-sulfur.md for the narrative atlas and ⚠️ rationale.
#
# Curated `blast_refs_uniprot` for soxB/C/D/X/Y/Z, sqr, sdo, tth, doxD, dsrA, dsrB
# are LIFTED VERBATIM from the validated ewaste-pipeline targets.yaml (function-
# verified accessions). The trained custom HMMs for soxB/soxD/soxX/tth/doxD are
# lifted from ewaste-pipeline/targets/{tid}/. Empty `blast_refs_uniprot: []` with a
# `ref_query:` hint means seeds are to be CURATED in the hardening phase (never guessed).
#
# ⚠️ HOMOLOGY / DIRECTIONALITY TRAPS:
#   dsrAB        reductive (sulfate reducers) vs reverse/oxidative rDSR (sulfur
#                oxidizers) — SAME genes/KO, opposite direction. Resolved by operon
#                synteny (dsrD/qmo proximity) in apply_rules.resolve_dsr_direction
#                (nucleotide/MAG input only) + the reverse_dsr_sulfur_oxidation synergy.
#   sat, aprAB   shared across dissimilatory / assimilatory / oxidative S metabolism —
#                direction inferred at the complex/synergy layer, not per gene.
#   soxC         PF03473 (MOSC molybdopterin) broad; KO K17225 is specific, BLAST seeds corroborate.
#   sqr / fccB   PF07992 (Pyr_redox_2 FAD) broad — BLAST gate to canonical SQR seeds.
#   sdo          PF00753 (metallo-β-lactamase) broad — BLAST gate to bacterial Sdo seeds.
# ─────────────────────────────────────────────────────────────────────────────

targets:

  # ── 1. Dissimilatory sulfate reduction (SO4²⁻ → SO3²⁻ → H2S) ───────────────
  - id: sat
    name: Sulfate adenylyltransferase (ATP sulfurylase)
    category: dissimilatory_sulfate_reduction
    ko: [K00958]
    pfam: [PF01747]
    interpro: [IPR024951]
    blast_fallback: false
    blast_refs_uniprot: []
    ref_query: "Desulfovibrio vulgaris Hildenborough[organism] AND sat[gene]"
    notes: "Entry/exit point of dissimilatory AND assimilatory sulfate metabolism (SO4²⁻ → APS). Shared KO; direction set by partner genes (aprAB+dsr ⇒ dissimilatory; cysNCDH ⇒ assimilatory)."
  - id: aprA
    name: Adenylylsulfate reductase subunit A (APS reductase, flavoprotein)
    category: dissimilatory_sulfate_reduction
    ko: [K00394]
    pfam: [PF00890]
    interpro: [IPR012744]
    blast_fallback: false
    blast_refs_uniprot: []
    ref_query: "Desulfovibrio vulgaris Hildenborough[organism] AND aprA[gene]"
    notes: "APS → sulfite (reductive) or reverse (oxidative, sulfur oxidizers). Diagnostic of dissimilatory S metabolism with dsrAB."
  - id: aprB
    name: Adenylylsulfate reductase subunit B (Fe-S)
    category: dissimilatory_sulfate_reduction
    ko: [K00395]
    pfam: []
    interpro: [IPR012675]
    blast_fallback: false
    blast_refs_uniprot: []
    ref_query: "Desulfovibrio vulgaris Hildenborough[organism] AND aprB[gene]"
  - id: dsrA
    name: Dissimilatory sulfite reductase alpha subunit
    category: dissimilatory_sulfate_reduction
    ko: [K11180]
    pfam: [PF01077]
    interpro: [IPR003794]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: [P45574, Q59109, O33998, S0FXQ9, Q9F4A3]   # ewaste-curated canonical DsrA: D.vulgaris/A.fulgidus/A.vinosum/D.desulfuricans/D.phosphitoxidans (spans sulfate-reducer + reverse-Dsr)
    ref_query: "Desulfovibrio vulgaris Hildenborough[organism] AND dsrA[gene]"
    notes: "⚠️ DIRECTION TRAP: same gene in sulfate reducers (reductive) and sulfur oxidizers (reverse/rDSR). KO K11180 is dsr-specific (separates from nitrite reductases at the KO tier, unlike the shared PF01077). BLAST gate drops broad nitrite-reductase paralogs; reductive-vs-oxidative call is made by operon synteny (dsrD proximity) + the reverse_dsr synergy."
  - id: dsrB
    name: Dissimilatory sulfite reductase beta subunit
    category: dissimilatory_sulfate_reduction
    ko: [K11181]
    pfam: [PF01077, PF03460]
    pfam_logic: all
    interpro: [IPR011806]
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 40
    blast_refs_uniprot: [P45575, Q59110, D3RSN2, S0G5M9, Q9F4A2]   # ewaste-curated canonical DsrB
    ref_query: "Desulfovibrio vulgaris Hildenborough[organism] AND dsrB[gene]"
    notes: "⚠️ Both PF01077+PF03460 (logic:all) discriminate dsrB from dsrA. Same direction trap as dsrA."
