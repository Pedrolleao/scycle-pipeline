tc_bitscore: 433.4
tc_rationale: "SP3 re-calibration (2026-05-26) on the SP1 22-genome sulfur panel. The lifted
  ewaste TC=758.7 was a min_positive*0.95 fallback calibrated on alphaproteobacterial/Thermus
  training refs, and it sat ABOVE a genuine panel positive: epsilonproteobacterial Sulfurimonas
  denitrificans soxB scores 683.8 (a true SOB, soxB GT-present) while the highest panel true
  negative (B. subtilis) scores only 182.9. TC = midpoint(683.8, 182.9) = 433.4 captures all 5
  panel soxB positives (683.8-934.4) via the HMM with a >250-bit margin to the top negative.
  The soxB KO K17224 previously rescued Sulfurimonas (masking the HMM's training-clade bias);
  the HMM now generalizes to the epsilon clade standalone. Verified on all 22 panel proteomes."
