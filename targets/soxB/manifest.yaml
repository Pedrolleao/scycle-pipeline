  \ Mirrors P07024.\n  9. Q8EBF3 \u2014 S. oneidensis CpdB, 685 aa, PF00149+PF02872.\n\
  \  10. Q8EC27 \u2014 S. oneidensis 5'-nucleotidase, 583 aa, PF00149+PF02872.\n \
  \   THIS is the closest size match to canonical soxB (583 vs 564 aa) of\n    any\
  \ test-genome PF00149+PF02872 protein. If any non-Sox 5'-nucleotidase\n    is going\
  \ to FP, this is the most likely candidate.\n\nTest-genome C. metallidurans CH34\
  \ anchors (3):\n  11. Q1LQW8 \u2014 C. metallidurans CpdB, 702 aa, PF00149+PF02872.\n\
