  \ 0.85 splits species-level identity while\ncollapsing strain duplicates and intra-Paracoccus\
  \ / intra-Chlorobi\nredundancy. Expect 16-20 clusters after CD-HIT @0.85.\n\nmin_seqs_override\
  \ NOT set: 23 keeps \u2192 expected 15-19 clusters at 0.85,\nwell above MIN_SEQS=8.\
  \ No floor concern.\n\n==========================================================================\n\
  hmm_min_qcov: NOT set (per brief recommendation)\n==========================================================================\n\
  Brief notes soxB HMM will be ~570 aa LENG, large enough to enforce full-\nlength\
  \ match against canonical soxB without an explicit qcov filter. Same\nsize class\
  \ as cyc2 (449), mtrC, soxD (~370). The qcov filter was needed\nfor small (<250\
  \ aa) HMMs hitting single domains of large multidomain\nproteins (hcnA precedent,\
  \ soxX precedent at 0.6). soxB at ~570 aa LENG\nis in the no-qcov-needed class.\n\
  \nCalibration safety net: if validation shows false positives \u2014 particularly\n\
  via the ~280-450 aa M. extorquens single-domain metallophosphoesterases\nhitting\
  \ via the PF00149 sub-region only \u2014 set hmm_min_qcov: 0.7\nretrospectively.\
  \ Initial expectation: not needed because the C-terminal\nPF02872 5'-nucleotidase\
  \ domain is the diagnostic discriminator that\nsingle-domain phosphoesterases lack.\n\
  \n==========================================================================\nNegatives\
  \ set (15) \u2014 designed to lock the HMM specifically to Sox-pathway\nsulfate\
  \ thiohydrolase vs the broad PF00149/PF02872 superfamily of\nmetallophosphoesterases,\
  \ 5'-nucleotidases, and calcineurin-like phosphatases.\n==========================================================================\n\
