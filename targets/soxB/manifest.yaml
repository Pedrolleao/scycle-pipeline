curator: pedro.leao.ru@gmail.com
curation_date: '2026-05-22'
notes: "Priority B #10 \u2014 soxB = ~564-594 aa periplasmic sulfate thiohydrolase\n\
  with dinuclear Mn centre. Releases sulfate from SoxYZ-bound sulfonate,\nregenerating\
  \ the SoxYZ acceptor. Domain architecture: PF00149 (Metallophos,\ncalcineurin-like\
  \ phosphoesterase) + PF02872 (5'-Nucleotidase C-terminal).\nCustom HMM must replace\
  \ v1's broad PF00149/PF02872 single-Pfam call, which\nfalse-positive-confirmed sox_core\
  \ 'complete' in M. extorquens AM1.\n\nNOTE on Pfam: brief flagged 'PF04879' as the\
  \ broad superfamily, but\nverification against canonical soxB seeds (A0AAE6TS95\
  \ / Q1W3E6 / Q8RLW8)\nshows the actual soxB Pfams are PF00149 (Metallophos) + PF02872\n\
  (5'-nucleotidase C-term). PF04879 is the 'Molybdopterin oxidoreductase\nFe4S4 domain'\
  \ family (DMSO/nitrate/FDH reductases) \u2014 a separate broad\nfamily. The v1 false-positive\
  \ mechanism is the same in principle: PF00149\nis hugely broad (calcineurin-family\
  \ Ser/Thr phosphatases, PhoX-family\nphosphatases, 5'-nucleotidases, UshA, CpdB,\
  \ lpxH, apaH, sbcD, etc.) so\nany organism's PF00149-bearing housekeeping protein\
  \ trips it.\n\n==========================================================================\n\
  Curation (2026-05-20, P. Le\xE3o): 23 keeps total = 4 seeds + 19 additions.\n==========================================================================\n\
  Lineage breakdown (mirrors soxX/soxD lineage choices for batch parity):\n- Paracoccus:\
  \ 3 (A0AAE6TS95 seed P. pantotrophus, A0A3P5XBC3 Paracoccaceae,\n   A0A2K9MGX0 P.\
  \ jeotgali) \u2014 same 3-Paracoccus pattern as soxX/soxD\n- Allochromatium (purple\
  \ sulfur 594 aa): 2 (Q1W3E6 seed + A0A6N8EBS6)\n- Other Chromatiaceae purple-sulfur:\
  \ 3 (G2E2I3 Thiocystis-class 593 aa,\n   A0A5M8FG03 Thiohalocapsa marina 595 aa,\
  \ A0A9X0WIB2 Thiocapsa imhoffii 592 aa)\n- Chlorobium/Chlorobiaceae green-sulfur:\
  \ 3 (Q8RLW8 seed C. limicola,\n   A0A5C4S040 Chlorobiaceae, Q3APA0 C. chlorochromatii)\
  \ + Q8KDM5 Chlorobaculum +\n   B3QNI1 (3rd Chlorobiaceae) + B4SEL4 Pelodictyon +\
  \ A0A317T8Z0 Prosthecochloris\n   = 7 green-sulfur reps across 5 genera (Chlorobium,\
  \ Chlorobaculum,\n   Pelodictyon, Prosthecochloris, generic Chlorobiaceae). Green-sulfur\
  \ is\n   over-represented because the seed set is 3/4 alpha+gamma and Chlorobi\n\
  \   diversity is biologically distinct enough to warrant ~30% of keeps.\n- Ancylobacter/Starkeya\
  \ (chemolithoautotrophic alpha): 2 (Q9LAH6 seed\n   A. novellus = Starkeya novella\
  \ synonym + A0A9W6JB81 Ancylobacter)\n- Cereibacter / Rhodobacter clade: 1 (A0A2T4JWS4\
  \ C. changlensis) \u2014 mirrors\n   soxX A0A2T4JWN2 / soxD A0A2T4JX11\n- Gemmobacter:\
  \ 1 (A0A398BY59) \u2014 mirrors soxX A0A1N7MDE4 / soxD A0A1N7MDE9\n- Ruegeria: 1\
  \ (Q5LUQ6 R. pomeroyi SPO0995, adjacent locus to soxD Q5LUQ4 +\n   soxX Q5LUR0 \u2014\
  \ full operon-context model organism)\n- Rhodovulum: 1 (A0A844BD62 R. strictum)\
  \ \u2014 brief-listed positive lineage;\n   mirrors soxX A0A844BA00\n- Sulfur-oxidising\
