  \ \u2014 the soxX/soxD PF00034 hits would not\nalone have called sox_core 'complete'\
  \ without soxB also tripping.\n\nTest-genome M. extorquens AM1 anchors (5) \u2014\
  \ the v1 FP culprits:\n  1. C5ASA1 \u2014 *** THE smoking-gun v1 FP driver. M. extorquens\
  \ AM1 'soxB'-\n    annotated paralog (Tat-pathway signal, 559 aa, PF02872, EC 3.1.3.5).\n\
  \    UniProt annotation classifies it as 'sulfur/thiosulfate oxidation\n    protein\
  \ SoxB' BY HOMOLOGY, but M. extorquens is a methylotroph with\n    no functional\
  \ Sox pathway (no soxA/soxX in operon context). This\n    protein is a soxB-family\
  \ orphan paralogue in non-Sox-operon context.\n    Calibration MUST place C5ASA1\
  \ below TC; if it scores above, the v1\n    bug is unfixed. *** HIGH HARD-NEGATIVE\
  \ RISK *** \u2014 C5ASA1 shares the\n    canonical PF02872 domain at the canonical\
  \ position, so it will likely\n    score close to positives. May force TC to be\
  \ set very close to min_pos\n    (loss of margin). Document outcome carefully in\
  \ calibration.\n  2. C5AYW1 \u2014 M. extorquens 5'-nucleotidase / CpdB-like, 500\
  \ aa,\n    PF00149+PF02872. Closest non-Sox architecture match (both Pfams\n   \
  \ present, similar length). High-value discrimination anchor.\n  3. C5ASH8 \u2014\
  \ M. extorquens metallophosphoesterase, 444 aa, PF00149 only.\n    Large single-PF00149-domain\
  \ phosphoesterase; tests whether HMM\n    discriminates fusion (PF00149+PF02872)\
  \ from single-domain PF00149.\n  4. C5AWR8 \u2014 M. extorquens metallophosphatase,\
  \ 315 aa, PF00149.\n    Mid-size single-PF00149 outgroup.\n  5. C5AWH2 \u2014 M.\
  \ extorquens metallophosphoesterase, 377 aa, PF00149.\n    Second mid-size single-PF00149\
  \ outgroup; M. extorquens has 21 PF00149\n    proteins total \u2014 these 5 anchors\
  \ cover the diversity (different sizes,\n    domain architectures, annotation classes).\n\
  \nTest-genome E. coli K-12 anchors (2) \u2014 PF00149+PF02872 fusion family in\n\
  a non-sulfur-oxidising context:\n  6. P07024 \u2014 E. coli UshA (UDP-sugar hydrolase\
  \ / 5'-nucleotidase), 550 aa,\n    PF00149+PF02872. CRITICAL: SAME domain architecture\
  \ as soxB, SAME\n    length range (550 vs 564 soxB seed). The toughest possible\
  \ discrimination\n    test in the test-genome panel \u2014 'fusion architecture,\
  \ non-Sox biology'.\n  7. P08331 \u2014 E. coli CpdB (2',3'-cyclic-nucleotide 2'-phosphodiesterase),\n\
  \    647 aa, PF00149+PF02872. 2nd fusion-architecture E. coli anchor.\n\nTest-genome\
  \ S. oneidensis MR-1 anchors (3) \u2014 fusion family in another\ntest genome with\
