tc_rationale: "SP3 re-calibration (2026-05-26) on the SP1 22-genome sulfur panel. The lifted
  ewaste TC=351.7 (training midpoint, min_pos 491.6 / max_neg 211.8) sat above two genuine panel
  positives: R. palustris (317.6, strong soxD BLAST 59.3%) and epsilon Sulfurimonas (174.0) — both
  soxD GT-present (SoxCD complex, soxC+). soxD is KO-less, so these were REAL false negatives
  (soxD F1 was 0.67). Highest panel true negative (S. meliloti diheme-cyt paralog) = 137.2.
  TC = midpoint(174.0, 137.2) = 155.6 captures all 4 panel soxD positives (174.0-592.6); with the
  >30% BLAST-confirmation gate both FNs are recovered and no negative is called. soxD F1 -> 1.00."
n_seqs_final: 20
curator: pedro.leao.ru@gmail.com
curation_date: '2026-05-20'
notes: "Priority B #12 \u2014 soxD = ~345-400 aa periplasmic diheme c-type cytochrome,\n\
  partner of SoxC sulfite dehydrogenase in the SoxCD complex that oxidises SoxYZ-\n\
  bound sulfane sulfur to SoxYZ-bound sulfonate. Custom HMM must replace v1's\nbroad\
  \ PF00034 (cyt c monoheme), which false-positive-called sox_core \"complete\"\n\
  in M. extorquens (PF00034 hits each of the two heme domains separately so any\n\
  multi-heme cyt c-containing organism trips it).\n\n==========================================================================\n\
  Curation (2026-05-20, P. Le\xE3o): 22 keeps total = 4 seeds + 18 additions.\n==========================================================================\n\
  Lineage breakdown (target diversity across Sox-positive lineages):\n  - Paracoccus:\
  \ 3 (P. denitrificans seed O07819, A0A3D9XZ68 Paracoccus, P. thiocyanatus\n    A0A3D8PBK7)\
  \ \u2014 3 species inside the type Sox genus\n  - Pseudaminobacter: 1 (Q5ZQM8 seed)\n\
  \  - Roseobacter (type genus): 1 (Q16A43 seed R. denitrificans)\n  - Ruegeria: 2\
  \ (Q5LUQ4 seed R. pomeroyi + A0A1G6RZG1 R. marina)\n  - Gemmobacter: 1 (A0A1N7MDE9\
  \ G. megaterium)\n  - Pseudogemmobacter: 1 (A0A3P5X2L8 P. humi)\n  - Paragemmobacter:\
  \ 1 (A0A6M1UA17 P. kunshanensis)\n  - Sulfitobacter: 1 (A0A073IW08 S. donghicola)\
  \ \u2014 explicitly listed Sox lineage\n  - Phaeobacter: 1 (A0A1L3I3I9 P. porticola)\n\
  \  - Leisingera: 1 (A0A0P1HC84 Leisingera sp.)\n  - Shimia: 1 (A0A1M6P350 S. gijangensis)\n\
  \  - Ascidiaceihabitans: 1 (A0A2R8BEW5)\n  - Cereibacter: 1 (A0A2T4JX11 C. changlensis)\
  \ \u2014 formerly Rhodobacter sphaeroides clade\n  - Pseudothioclava: 1 (A0A2A4CSZ7\
  \ P. arenosa) \u2014 explicit thiosulfate-oxidising lineage\n  - Pseudomonadota\
  \ \"P. denitrificans PD1222\" annotated: 1 (A1B9M6, explicit\n    SoxD annotation)\n\
  \  - Non-Rhodobacteraceae Hyphomicrobiales (Rhizobiales-relatives): 3\n    (Pseudorhizobium\
  \ L0NGY6, Hoeflea A9DG76, Nitratireductor pacificus K2M5E9)\n  - Borborobacter arsenicus\
  \ (A0A432V1L7) \u2014 non-Rhodobacteraceae, arsenic-context\n    relevant for e-waste\
  \ metalloid contexts\n\nThis is a Rhodobacteraceae-heavy keep set (matching brief's\
  \ expectation:\n\"expansion should be Rhodobacteraceae-heavy\"). 17/22 keeps are\
  \ Rhodobacteraceae\nor close relatives, 5/22 are non-Rhodobacteraceae alphaproteobacterial\
  \ outgroups.\nThis mirrors the canonical SoxD distribution: the Sox pathway is densely\
  \ sampled\nin marine Roseobacter biology.\n\nLength distribution: 345-392 aa across\
  \ kept seqs, all within the brief's\nexpected 300-420 aa canonical SoxD window.\
  \ The narrow range (47-aa span) is\nconsistent with single-domain SoxD architecture,\
  \ not SoxCD-fusion.\n\n==========================================================================\n\
  SoxCD-fusion check: NONE encountered in candidate pool\n==========================================================================\n\
  Brief flagged risk of 600-700 aa SoxCD-fusion proteins (where SoxC sulfite\ndehydrogenase\
  \ is co-translated with SoxD diheme cyt c as a single polypeptide).\nThese would\
  \ need EXCLUSION (different domain architecture, functionally\nequivalent but structurally\
  \ divergent \u2014 including them would confuse the HMM\nconsensus toward bimodal\
  \ length distribution).\n\nMaximum length in the entire 200-row candidate pool is\
  \ 496 aa (A0A8K0XZ80\nSzabonella alba). No 600-700 aa entries exist in this expansion.\
  \ Likely\nreasons: (a) phmmer score-200 cutoff filtered SoxCD fusions to below threshold\n\
  because the SoxC half of the fusion adds non-cytochrome residues that don't\nalign\
  \ to the diheme cyt c seed; (b) UniRef90 clustering may pull fusions into\nseparate\
  \ clusters dominated by their SoxC half. Either way: the pool we\nreceived is clean\
  \ of fusion contamination.\n\nFive candidates 437-496 aa (A0A8K0XZ80 496, A0ABX0G5W8\
  \ 457, UPI002724E100 465,\nA0ABY2KJ70 453, UPI00391D8935 455, UPI0010AAD869 439,\
  \ UPI004059CEF0 437,\nUPI003298557D 442) \u2014 these exceed the canonical 300-420\
  \ aa window but fall\nshort of fusion size. They likely have N- or C-terminal extensions\
  \ (signal\npeptide retention, propeptide, paralog). All DROPPED to keep the HMM\n\
  consensus tight on canonical SoxD length.\n\n==========================================================================\n\
  cdhit_threshold: 0.85 \u2014 matches soxX / hcnA / mtrC / cyc2 precedent\n==========================================================================\n\
  Diheme cyt c is moderately conserved within a sub-lineage but more variable\nacross\
  \ the Paracoccus / Allochromatium / Pseudaminobacter / non-Rhodobacteraceae\nspread.\
  \ 0.85 splits species-level identity while collapsing strain duplicates.\nExpect\
  \ 14-18 clusters after CD-HIT @0.85. 0.7 would risk collapsing 3 Paracoccus\nspecies\
  \ into 1-2 clusters; 0.95 would inflate Ruegeria + Paracoccus genera to\nredundant\
  \ cluster counts.\n\nmin_seqs_override NOT set: 22 keeps \u2192 expected 14-18 clusters\
  \ at 0.85, well\nabove MIN_SEQS=8. No floor concern.\n\n==========================================================================\n\
  hmm_min_qcov: NOT set (per brief recommendation)\n==========================================================================\n\
  Brief notes soxD HMM will be ~370 aa LENG (positives 345-392 aa), large enough\n\
  to enforce full-length match against canonical SoxD without an explicit qcov\nfilter.\
  \ The qcov filter (hcnA precedent: 0.7) was needed for small (<250 aa)\nHMMs hitting\
  \ single domains of large multidomain proteins. soxD's ~370 aa LENG\nis in the same\
  \ size class as cyc2 (449), cycA, mtrC \u2014 none of which needed qcov.\n\nCalibration\
  \ safety net: if validation shows false positives (e.g., M. extorquens\n~600+ aa\
  \ multi-domain cyt c hitting via partial coverage), set hmm_min_qcov: 0.7\nretrospectively.\
  \ But initial expectation: not needed.\n\n==========================================================================\n\
  Negatives set (13) \u2014 designed to lock the HMM specifically to Sox-pathway\n\
  diheme cyt c vs the broader universe of multi-heme cyt c proteins.\n==========================================================================\n\
  Test-genome anchors (6 \u2014 REUSED from soxX manifest, parallel curation):\n \
  \ 1. C5ASB2 \u2014 M. extorquens AM1 class-I cyt c (195 aa).\n     THE single most\
  \ important negative: M. extorquens has zero canonical Sox\n     biology, but v1's\
  \ PF00034 false-positive-confirmed sox_core in this\n     methylotroph by matching\
  \ its housekeeping cyt c's. Calibration MUST place\n     C5ASB2 below TC; if it\
  \ scores above, the HMM is still capturing generic\n     cyt c signal and the v1\
